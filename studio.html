<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1830">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <title>Every Morning Studio</title>
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">EVERY MORNING</p>
      <h1>Studio</h1>
    </div>
    <a class="icon-button icon-button--link" href="./index.html" aria-label="Fortuneへ戻る">←</a>
  </header>

  <main class="app-shell">
    <article class="hero-card">
      <p class="eyebrow">LOCAL ADMIN TOOL</p>
      <h2>Studio基盤</h2>
      <p class="hero-card__lead">編集・分析・品質管理機能は、占いエンジン完成後に段階的に接続します。</p>
    </article>

    <article class="card">
      <h3>現在利用できる診断</h3>
      <div id="diagnostics" class="stack diagnostics"></div>
      <button id="refreshDiagnostics" class="primary-button" type="button">再診断</button>
    </article>

    <article class="card">
      <h3>データ操作</h3>
      <p class="muted">Sprint 1.1では端末内データの簡易バックアップのみ提供します。</p>
      <div class="button-row">
        <button id="exportButton" class="secondary-button secondary-button--button" type="button">JSONを書き出す</button>
        <label class="secondary-button file-label">
          JSONを読み込む
          <input id="importInput" type="file" accept="application/json,.json" hidden>
        </label>
      </div>
      <p id="studioMessage" class="message" role="status"></p>
    </article>
  </main>

  <script type="module" src="./js/studio.js"></script>
</body>
</html>
